services:

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library_development
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGUSER: library
      PGPASSWORD: library
    volumes:
      - .:/rails

volumes:
  postgres_data:
